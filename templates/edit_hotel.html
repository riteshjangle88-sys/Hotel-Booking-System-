{% extends 'layout.html' %}

{% block title %}Edit {{ hotel.hotel_name }} - Admin - Vedic Stay{% endblock %}

{% block content %}
<section class="section-padding bg-light">
    <div class="container">
        
        <div class="mb-4">
            <a href="{{ url_for('admin_dashboard') }}" class="text-primary-blue fw-semibold text-decoration-none"><i class="fa fa-arrow-left me-2"></i> Back to Dashboard</a>
        </div>

        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card border-0 shadow-sm p-5" style="border-radius: 12px; border-top: 5px solid var(--gold);">
                    <h3 class="text-primary-blue display-font mb-4"><i class="fa fa-edit text-warning me-2"></i> Edit Hotel Details</h3>
                    
                    <form action="{{ url_for('edit_hotel', hotel_id=hotel.id) }}" method="POST">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="hotel_name" class="form-label fw-bold">Hotel Name</label>
                                <input type="text" class="form-control border-secondary" id="hotel_name" name="hotel_name" value="{{ hotel.hotel_name }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="image" class="form-label fw-bold">Hotel Banner Image</label>
                                <select class="form-select border-secondary" id="image" name="image" required>
                                    <option value="static/images/hotel1.jpg" {% if hotel.image == 'static/images/hotel1.jpg' %}selected{% endif %}>Luxury Palace Hotel (hotel1.jpg)</option>
                                    <option value="static/images/hotel2.jpg" {% if hotel.image == 'static/images/hotel2.jpg' %}selected{% endif %}>Tropical Beach Resort (hotel2.jpg)</option>
                                    <option value="static/images/hotel3.jpg" {% if hotel.image == 'static/images/hotel3.jpg' %}selected{% endif %}>Mountain Valley Lodge (hotel3.jpg)</option>
                                    <option value="static/images/hotel4.jpg" {% if hotel.image == 'static/images/hotel4.jpg' %}selected{% endif %}>Classic Modern Hotel (hotel4.jpg)</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="city" class="form-label fw-bold">City</label>
                                <input type="text" class="form-control border-secondary" id="city" name="city" value="{{ hotel.city }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="state" class="form-label fw-bold">State</label>
                                <input type="text" class="form-control border-secondary" id="state" name="state" value="{{ hotel.state }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label fw-bold">Full Address</label>
                            <input type="text" class="form-control border-secondary" id="address" name="address" value="{{ hotel.address }}" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="price" class="form-label fw-bold">Base Price / Night (₹)</label>
                                <input type="number" class="form-control border-secondary" id="price" name="price" value="{{ hotel.price }}" required min="1">
                            </div>
                            <div class="col-md-4">
                                <label for="rooms" class="form-label fw-bold">Total Available Rooms</label>
                                <input type="number" class="form-control border-secondary" id="rooms" name="rooms" value="{{ hotel.rooms }}" required min="0">
                            </div>
                            <div class="col-md-4">
                                <label for="rating" class="form-label fw-bold">Rating (★)</label>
                                <select class="form-select border-secondary" id="rating" name="rating" required>
                                    <option value="4.0" {% if hotel.rating == 4.0 %}selected{% endif %}>4.0 ★</option>
                                    <option value="4.2" {% if hotel.rating == 4.2 %}selected{% endif %}>4.2 ★</option>
                                    <option value="4.5" {% if hotel.rating == 4.5 %}selected{% endif %}>4.5 ★</option>
                                    <option value="4.8" {% if hotel.rating == 4.8 %}selected{% endif %}>4.8 ★</option>
                                    <option value="5.0" {% if hotel.rating == 5.0 %}selected{% endif %}>5.0 ★</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">Hotel Description</label>
                            <textarea class="form-control border-secondary" id="description" name="description" rows="4" required>{{ hotel.description }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="amenities" class="form-label fw-bold">Key Amenities (Comma-separated)</label>
                            <input type="text" class="form-control border-secondary" id="amenities" name="amenities" value="{{ hotel.amenities }}" required>
                            <span class="text-muted small">Type amenities separated by commas.</span>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="contact_number" class="form-label fw-bold">Reservation Contact Number</label>
                                <input type="text" class="form-control border-secondary" id="contact_number" name="contact_number" value="{{ hotel.contact_number }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="maps_link" class="form-label fw-bold">Google Maps Link (Optional)</label>
                                <input type="url" class="form-control border-secondary" id="maps_link" name="maps_link" value="{{ hotel.maps_link or '' }}">
                            </div>
                        </div>

                        <!-- Hidden fields for defaults -->
                        <input type="hidden" name="gallery" value="{{ hotel.gallery or 'static/images/room1.jpg,static/images/room2.jpg,static/images/room3.jpg' }}">

                        <button type="submit" class="btn btn-gold btn-lg w-100 py-3"><i class="fa fa-save me-1"></i> Save Changes</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</section>
{% endblock %}
