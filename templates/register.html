{% extends 'layout.html' %}

{% block title %}Register - Vedic Stay{% endblock %}

{% block content %}
<section class="auth-bg">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="glass-card">
                    <div class="text-center mb-4">
                        <i class="fa fa-user-plus text-warning fs-1 mb-2"></i>
                        <h2 class="text-primary-blue display-font">Create Account</h2>
                        <p class="text-muted small">Join Vedic Stay to book secure reservations on the blockchain.</p>
                    </div>
                    
                    <form action="{{ url_for('register') }}" method="POST" id="register-form">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa fa-user text-muted"></i></span>
                                <input type="text" class="form-control border-start-0" id="name" name="name" placeholder="Enter your full name" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="example@email.com" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa fa-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Create password" required minlength="6">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa fa-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="6">
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-gold w-100 py-3 mb-3"><i class="fa fa-user-plus me-1"></i> Register Account</button>
                        
                        <div class="text-center">
                            <span class="text-muted small">Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-bold">Login here</a></span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    document.getElementById('register-form').addEventListener('submit', function(e) {
        const pass = document.getElementById('password').value;
        const conf = document.getElementById('confirm_password').value;
        if (pass !== conf) {
            e.preventDefault();
            alert("Passwords do not match!");
        }
    });
</script>
{% endblock %}
